name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint check with Ruff
      run: |
        ruff check spec_pipeline/ tests/ demo.py run_ui.py

    - name: Static Type Check with Mypy
      run: |
        mypy spec_pipeline/ tests/ demo.py run_ui.py --ignore-missing-imports

    - name: Run Test Suite & Coverage
      run: |
        pytest -v --cov=spec_pipeline --cov-report=term-missing

    - name: Run End-to-End CLI Demonstration
      run: |
        python demo.py
